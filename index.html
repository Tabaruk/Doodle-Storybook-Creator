<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Storybook Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #fdfbf7;
            --brand-coral: #e86f5b;
            --brand-cyan: #46b5d1;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-cream);
            margin: 0;
            padding: 30px 20px;
            color: var(--text-dark);
            min-height: 100vh;
        }

        .main-container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(70, 181, 209, 0.1);
            border: 3px solid #f0ede6;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 20px;
        }

        .printer-icon {
            width: 70px;
            height: 70px;
            background: var(--brand-cyan);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 6px 15px rgba(70, 181, 209, 0.3);
            position: relative;
        }

        .brand-title h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
        }

        .brand-title h1 span.doodle {
            color: var(--brand-coral);
        }

        .brand-title h1 span.prints {
            color: var(--brand-cyan);
        }

        .brand-title p {
            margin: 4px 0 0 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            background-color: #faf8f5;
            color: var(--text-dark);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--brand-cyan);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(70, 181, 209, 0.15);
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--brand-coral) 0%, #f28b7c 100%);
            color: white;
            border: none;
            padding: 16px 20px;
            width: 100%;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 6px 20px rgba(232, 111, 91, 0.3);
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn-generate:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .result-section {
            margin-top: 35px;
        }

        .result-section h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        #result {
            background: #faf8f5;
            padding: 22px;
            border-radius: 16px;
            border: 2px dashed #dcd6cd;
            white-space: pre-wrap;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.7;
            max-height: 480px;
            overflow-y: auto;
            color: #4a5568;
        }

        .loading {
            color: var(--brand-cyan);
            text-align: center;
            font-weight: 700;
            font-style: italic;
        }

        .app-footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="brand-header">
        <div class="printer-icon">🖨️</div>
        <div class="brand-title">
            <h1><span class="doodle">Doodle</span> <span class="prints">Storybook</span></h1>
            <p>Cetak Imajinasi Jadi Realisasi!</p>
        </div>
    </div>
    
    <div class="form-group">
        <label>API Key Google AI Studio</label>
        <input type="password" id="apiKey" placeholder="Masukkan Gemini API Key Anda">
    </div>

    <div class="form-group">
        <label>1. Judul atau Tema Cerita</label>
        <input type="text" id="storyTitle" placeholder="Contoh: Petualangan Kancil di Hutan Ajaib">
    </div>

    <div class="form-group">
        <label>2. Target Usia Anak</label>
        <select id="audience">
            <option value="3-5 tahun">3 - 5 tahun (Kalimat pendek & sederhana)</option>
            <option value="6-8 tahun">6 - 8 tahun (Cerita interaktif & edukatif)</option>
            <option value="9-12 tahun">9 - 12 tahun (Petualangan kompleks)</option>
        </select>
    </div>

    <div class="form-group">
        <label>3. Gaya Ilustrasi Visual</label>
        <select id="style">
            <option value="Watercolor (Cat Air) - Soft & Warm">Watercolor (Cat Air) - Soft & Warm</option>
            <option value="3D Pixar Style - Cute & Colorful">3D Pixar Style - Cute & Colorful</option>
            <option value="Gouache Storybook Style">Gouache Storybook Style</option>
            <option value="Flat Vector Cartoon">Flat Vector Cartoon</option>
        </select>
    </div>

    <div class="form-group">
        <label>4. Total Halaman</label>
        <input type="number" id="pages" value="5" min="3" max="10">
    </div>

    <button class="btn-generate" onclick="generateStory()">✨ Buat Cerita Sekarang</button>

    <div class="result-section">
        <h3>Hasil Draf Buku Cerita:</h3>
        <div id="result">Hasil draf cerita dan panduan ilustrasi akan muncul di sini...</div>
    </div>

    <div class="app-footer">
        Doodle Storybook Creator &bull; Versi 1.1 | 13.10.2026
    </div>
</div>

<script>
async function generateStory() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const title = document.getElementById('storyTitle').value.trim();
    const audience = document.getElementById('audience').value;
    const style = document.getElementById('style').value;
    const pages = document.getElementById('pages').value;
    const resultDiv = document.getElementById('result');

    if (!apiKey) {
        alert('Harap masukkan Gemini API Key terlebih dahulu!');
        return;
    }

    if (!title) {
        alert('Harap isi Judul atau Tema Cerita!');
        return;
    }

    resultDiv.innerHTML = '<div class="loading">✨ Sedang merancang struktur cerita dan visual halaman... Mohon tunggu sebentar ya!</div>';

    const systemInstruction = "Kamu adalah AI Creator profesional pembuat buku cerita anak. Tugasmu adalah membuat struktur teks cerita lengkap per halaman beserta deskripsi visual/ilustrasi yang mendetail sesuai parameter yang diberikan pengguna.";
    
    const userPrompt = `Buatlah draf buku cerita anak dengan detail berikut:
- Judul/Ide: ${title}
- Target Usia: ${audience}
- Gaya Ilustrasi: ${style}
- Jumlah Halaman: ${pages} halaman.

Format output per halaman harus jelas mencakup:
1. Nomor Halaman
2. Teks Cerita (bahasa yang ramah anak)
3. Deskripsi Prompt Ilustrasi (untuk panduan gambar)`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: userPrompt }]
                }],
                system_instruction: {
                    parts: [{ text: systemInstruction }]
                }
            })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
            resultDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
            resultDiv.innerText = 'Terjadi kesalahan saat memproses respons dari Gemini API. Periksa kembali API Key Anda.';
        }
    } catch (error) {
        resultDiv.innerText = 'Gagal terhubung ke server: ' + error.message;
    }
}
</script>

</body>
</html>
